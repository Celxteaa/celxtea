<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sector B: Celestia Lab</title>

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@500;700&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Three.js + OrbitControls + PointerLockControls + GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <!-- Post-Processing Addons for Bloom Effect -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

  <style>
    :root {
      --bg-dark: #020617;
      --accent-cyan: #00f2fe;
      --accent-gold: #ffb703;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --glass: rgba(15, 23, 42, 0.85);
      --glass-border: rgba(0, 242, 254, 0.35);
      --font-gamify: 'Orbitron', sans-serif;
      --font-title: 'Space Grotesk', sans-serif;
      --font-code: 'Fira Code', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    html, body { width: 100%; height: 100vh; overflow: hidden; background: var(--bg-dark); font-family: var(--font-title); color: #fff; touch-action: none; }

    #webgl-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }

    /* GAMIFIED HIGH-TECH LOADING SCREEN STYLES */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #071126 0%, #020617 100%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.8s ease, visibility 0.8s ease;
      overflow: hidden;
    }
    #loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Ambient Scanlines Effect */
    #loading-screen::before {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      background-size: 100% 4px, 6px 100%;
      pointer-events: none;
      z-index: 2;
    }

    .loading-box {
      width: 90%;
      max-width: 500px;
      padding: 35px 30px;
      background: rgba(10, 18, 36, 0.75);
      border: 1px solid rgba(0, 242, 254, 0.3);
      border-radius: 8px;
      backdrop-filter: blur(25px);
      box-shadow: 0 0 40px rgba(0,242,254,0.15), inset 0 0 20px rgba(0,242,254,0.05);
      text-align: center;
      position: relative;
      z-index: 3;
    }

    /* Game UI Corner Brackets */
    .loading-box::before, .loading-box::after {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      border: 2px solid var(--accent-cyan);
    }
    .loading-box::before { top: -2px; left: -2px; border-right: none; border-bottom: none; }
    .loading-box::after { bottom: -2px; right: -2px; border-left: none; border-top: none; }

    /* Futuristic Rotating Ring Spinner */
    .spinner-container {
      position: relative;
      width: 90px;
      height: 90px;
      margin: 0 auto 25px auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .spinner-outer {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 2px dashed rgba(0, 242, 254, 0.4);
      border-radius: 50%;
      animation: spin 8s linear infinite;
    }
    .spinner-inner {
      position: absolute;
      width: 70%;
      height: 70%;
      border: 2px solid transparent;
      border-top-color: var(--accent-cyan);
      border-bottom-color: var(--accent-green);
      border-radius: 50%;
      animation: spin-reverse 1.5s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
    }
    .spinner-core {
      width: 12px;
      height: 12px;
      background: var(--accent-cyan);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--accent-cyan);
    }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes spin-reverse { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }

    .loading-title {
      font-family: var(--font-gamify);
      font-weight: 900;
      font-size: 1.2rem;
      color: var(--accent-cyan);
      letter-spacing: 3px;
      margin-bottom: 20px;
      text-shadow: 0 0 12px rgba(0,242,254,0.6);
      text-transform: uppercase;
    }

    .loading-bar-container {
      width: 100%;
      height: 8px;
      background: rgba(2, 6, 23, 0.9);
      border: 1px solid rgba(0, 242, 254, 0.4);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      margin-bottom: 12px;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.8);
    }
    .loading-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-green));
      box-shadow: 0 0 15px var(--accent-cyan);
      transition: width 0.2s ease-out;
    }

    .loading-status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-code);
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 15px;
    }
    .loading-percentage {
      font-weight: bold;
      color: var(--accent-cyan);
    }

    /* Live Game Console Logs Below Bar */
    .loading-console {
      font-family: var(--font-code);
      font-size: 0.68rem;
      color: rgba(0, 242, 254, 0.6);
      text-align: left;
      height: 36px;
      overflow: hidden;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 8px;
    }

    /* Top Action Bar Buttons (Camera Controls) */
    .camera-hud-controls {
      position: fixed; top: 20px; right: 20px; z-index: 50; display: flex; gap: 10px;
    }
    .hud-btn {
      background: var(--glass); border: 1px solid var(--glass-border); color: var(--accent-cyan);
      font-family: var(--font-code); font-size: 0.8rem; font-weight: 600; padding: 10px 16px;
      border-radius: 8px; cursor: pointer; transition: all 0.25s ease; backdrop-filter: blur(12px);
      display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 20px rgba(0,242,254,0.15);
    }
    .hud-btn:hover { background: rgba(0, 242, 254, 0.2); transform: translateY(-2px); border-color: var(--accent-cyan); box-shadow: 0 6px 25px rgba(0,242,254,0.3); }
    .hud-btn:active { transform: translateY(0); }

    /* Mobile Controls Container */
    #mobile-controls {
      position: fixed; bottom: 30px; left: 30px; z-index: 60; display: none; width: 120px; height: 120px;
      background: rgba(255, 255, 255, 0.05); border: 2px solid var(--glass-border); border-radius: 50%;
      touch-action: none; backdrop-filter: blur(8px);
    }
    #joystick-stick {
      position: absolute; top: 50%; left: 50%; width: 45px; height: 45px;
      background: var(--accent-cyan); border-radius: 50%; transform: translate(-50%, -50%);
      opacity: 0.85; box-shadow: 0 0 15px var(--accent-cyan); pointer-events: none;
    }
    /* Mobile Touch Look Area Hint */
    #touch-look-zone {
      position: fixed; top: 0; right: 0; width: 50vw; height: 100vh; z-index: 40; display: none; touch-action: none;
    }

    /* Modal Info Window / Windows-like OS UI */
    .project-modal {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -45%) scale(0.95);
      width: 90%; max-width: 560px; background: var(--glass); backdrop-filter: blur(35px);
      border: 1px solid var(--glass-border); border-radius: 12px; padding: 0;
      z-index: 200; opacity: 0; pointer-events: none; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 20px 60px rgba(0,0,0,0.95), 0 0 30px rgba(0,242,254,0.1); overflow: hidden;
    }
    .project-modal.active { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }

    /* Windows-style Titlebar */
    .win-titlebar {
      background: rgba(2, 6, 23, 0.95); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--glass-border); font-family: var(--font-code); font-size: 0.75rem; color: var(--accent-cyan);
    }
    .win-controls { display: flex; gap: 8px; }
    .close-btn {
      background: rgba(239, 68, 68, 0.2); border: 1px solid var(--accent-red); color: #fff; width: 24px; height: 24px;
      border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.7rem;
      transition: background 0.2s, transform 0.2s;
    }
    .close-btn:hover { background: var(--accent-red); transform: scale(1.1); }

    .modal-body-content { padding: 24px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .project-tag { font-family: var(--font-code); font-size: 0.7rem; color: var(--accent-cyan); background: rgba(0,242,254,0.12); padding: 4px 10px; border-radius: 100px; border: 1px solid rgba(0,242,254,0.3); }
    .project-tag.danger { color: var(--accent-red); background: rgba(239,68,68,0.15); border: 1px solid var(--accent-red); }
    .project-tag.info { color: var(--accent-gold); background: rgba(255,183,3,0.15); border: 1px solid var(--accent-gold); }

    .modal-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 8px; text-shadow: 0 0 10px rgba(255,255,255,0.2); }
    .modal-desc { font-size: 0.85rem; color: rgba(255,255,255,0.85); line-height: 1.6; font-family: var(--font-code); }

    /* Action Link Button Inside Modal */
    .modal-link-btn {
      display: inline-flex; align-items: center; gap: 8px; margin-top: 15px; padding: 8px 16px;
      background: rgba(0, 242, 254, 0.15); border: 1px solid var(--accent-cyan); color: var(--accent-cyan);
      border-radius: 6px; font-family: var(--font-code); font-size: 0.8rem; font-weight: 600;
      text-decoration: none; transition: all 0.2s ease;
    }
    .modal-link-btn:hover { background: var(--accent-cyan); color: var(--bg-dark); box-shadow: 0 0 15px var(--accent-cyan); }

    /* Windows Control Center Panel inside Computer UI */
    .os-control-panel {
      margin-top: 15px; background: rgba(2, 6, 23, 0.85); border: 1px solid var(--glass-border);
      border-radius: 8px; padding: 14px; display: flex; align-items: center; justify-content: space-between;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
    }
    .os-control-info span { display: block; font-size: 0.75rem; font-family: var(--font-code); color: rgba(255,255,255,0.6); }
    .os-control-info strong { font-size: 0.9rem; font-family: var(--font-title); color: #fff; }
    
    .os-toggle-btn {
      background: var(--accent-green); border: none; color: #020617; font-family: var(--font-code);
      font-weight: 600; padding: 8px 16px; border-radius: 6px; cursor: pointer; transition: all 0.2s;
      box-shadow: 0 0 10px rgba(16,185,129,0.4);
    }
    .os-toggle-btn.off { background: var(--accent-red); color: #fff; box-shadow: 0 0 10px rgba(239,68,68,0.4); }
    .os-toggle-btn:hover { opacity: 0.9; transform: scale(1.05); }

    /* Live Terminal Console UI */
    .terminal-console {
      margin-top: 15px; background: rgba(2, 6, 23, 0.95); border: 1px solid var(--accent-cyan);
      border-radius: 8px; padding: 12px; font-family: var(--font-code); font-size: 0.75rem;
      color: var(--accent-cyan); max-height: 180px; overflow-y: auto; text-shadow: 0 0 8px rgba(0,242,254,0.6);
      box-shadow: inset 0 0 10px rgba(0,242,254,0.15);
    }
    .terminal-line { margin-bottom: 4px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .terminal-timestamp { color: rgba(255,255,255,0.4); }

    /* Interactive Command Input */
    .terminal-input-row { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
    .terminal-prompt { color: var(--accent-green); font-weight: bold; }
    .terminal-input {
      background: transparent; border: none; outline: none; color: #fff;
      font-family: var(--font-code); font-size: 0.75rem; flex: 1;
    }

    /* Hover Label */
    .cursor-label {
      position: fixed; pointer-events: none; z-index: 100;
      font-family: var(--font-code); font-size: 0.7rem; font-weight: 600; color: var(--accent-cyan);
      background: rgba(2,6,23,0.95); padding: 6px 12px; border-radius: 6px; border: 1px solid var(--accent-cyan);
      opacity: 0; transition: opacity 0.2s ease; transform: translate(15px, 15px);
      box-shadow: 0 0 15px rgba(0,242,254,0.3); backdrop-filter: blur(8px);
    }
  </style>
</head>
<body>

  <!-- GAMIFIED SCI-FI LOADING SCREEN UI -->
  <div id="loading-screen">
    <div class="loading-box">
      <div class="spinner-container">
        <div class="spinner-outer"></div>
        <div class="spinner-inner"></div>
        <div class="spinner-core"></div>
      </div>
      <div class="loading-title">CELESTIA LAB</div>
      <div class="loading-bar-container">
        <div id="loading-bar" class="loading-bar"></div>
      </div>
      <div class="loading-status-row">
        <span id="loading-text">BOOTSTRAPPING QUANTUM CHAMBER...</span>
        <span id="loading-percentage" class="loading-percentage">0%</span>
      </div>
      <div class="loading-console" id="loading-console">
        > Allocating VRAM buffers...<br>
        > Mounting spatial grid matrix...
      </div>
    </div>
  </div>

  <canvas id="webgl-canvas"></canvas>
  <div id="cursor-hint" class="cursor-label">INSPECT</div>

  <!-- Camera HUD Buttons -->
  <div class="camera-hud-controls">
    <button class="hud-btn" id="btn-first-person"><i class="fa-solid fa-person"></i> First Person</button>
    <button class="hud-btn" id="btn-reset-cam" onclick="resetOverview()"><i class="fa-solid fa-rotate-right"></i> Reset Camera</button>
  </div>

  <!-- Touch Zone for Drag-Look on Mobile FP Mode -->
  <div id="touch-look-zone"></div>

  <!-- Mobile Touch Joystick -->
  <div id="mobile-controls">
    <div id="joystick-stick"></div>
  </div>

  <div id="project-modal" class="project-modal">
    <div class="win-titlebar">
      <span id="win-title-bar-text"><i class="fa-brands fa-windows"></i> CelestiaOS — Mainframe Control Center</span>
      <div class="win-controls">
        <button class="close-btn" id="modal-close-btn"><i class="fa-solid fa-xmark"></i></button>
      </div>
    </div>
    <div class="modal-body-content">
      <div class="modal-header">
        <span id="m-tag" class="project-tag">CONTAINMENT POD</span>
      </div>
      <h2 id="m-title" class="modal-title">Pod Details</h2>
      <p id="m-desc" class="modal-desc">Description...</p>
      <div id="m-link-container"></div>
      <div id="os-control-wrapper" style="display: none;">
        <div class="os-control-panel">
          <div class="os-control-info">
            <span>ENVIRONMENTAL SYSTEM</span>
            <strong id="lab-light-status-text">Laboratory Main Lights: ACTIVE</strong>
          </div>
          <button id="os-power-btn" class="os-toggle-btn" onclick="toggleRoomLighting()">TURN OFF</button>
        </div>
      </div>
      <div id="m-terminal" class="terminal-console" style="display: none;"></div>
    </div>
  </div>

  <script>
    // System Loader Manager dengan Visual Console Log Ala Game
    const LoadingManager = {
      progress: 0,
      isFirstFrameRendered: false,
      logs: [
        "Allocating memory blocks...",
        "Linking Three.js WebGL Pipeline...",
        "Compiling PBR shaders & environment maps...",
        "Calibrating volumetric light cones...",
        "Loading audio synthesize engine...",
        "Mounting interactive telemetry nodes..."
      ],
      updateProgress(targetProgress, text) {
        if (this.progress < targetProgress) {
          this.progress = targetProgress;
          const bar = document.getElementById('loading-bar');
          const percent = document.getElementById('loading-percentage');
          const statusText = document.getElementById('loading-text');
          const consoleEl = document.getElementById('loading-console');

          if (bar) bar.style.width = `${Math.min(this.progress, 100)}%`;
          if (percent) percent.textContent = `${Math.round(Math.min(this.progress, 100))}%`;
          if (statusText && text) statusText.textContent = text;

          if (consoleEl) {
            const nextLog = this.logs.shift() || "Synchronizing core frames...";
            consoleEl.innerHTML = `> ${nextLog}<br>> ${text}`;
          }
        }
      },
      complete() {
        this.updateProgress(100, "SYSTEM READY — ENTERING LAB");
        setTimeout(() => {
          const screen = document.getElementById('loading-screen');
          if (screen) screen.classList.add('hidden');
        }, 400);
      }
    };

    // Sinkronisasi status awal pemuatan aset
    document.addEventListener('DOMContentLoaded', () => {
      LoadingManager.updateProgress(20, "Loading Three.js core & shaders...");
    });

    let scene, camera, renderer, controls, pointerControls;
    let composer, bloomPass; // Bloom Effect Post-Processing
    let interactiveObjects = [];
    let pendantLights = [];
    let roomLights = [];
    let roomMaterials = [];
    let flowPipes = [];
    let serverLEDs = [];
    let exitSignFace;
    let lightSwitchBtn;
    let isLightOn = true;
    let raycaster, mouse, hoveredObj = null;

    // Environmental state variables
    let currentChamberTemp = 18.0;

    // Puzzle Mini-Game States
    let puzzleActive = false;
    let puzzleStage = 1; // Stage 1: Frequency Calibration, Stage 2: Quantum Sequence, Stage 3: Security Passcode
    let puzzleTargetFreq = 0;
    let puzzleSequence = [];
    let puzzleSeqIndex = 0;
    let puzzlePasscode = 0;

    // DNA Hologram Object
    let dnaHologramGroup;

    // Prevent Double Trigger Bug
    let isClickBlocked = false;

    // Volumetric Fog Cones & Dust Particles
    let lightDustGroup;
    let volumetricCones = [];

    // Procedural Noise Textures for PBR Realism
    let bumpTextureFloor, bumpTextureMetal;

    // WASD Movement & Soft Collision
    const moveKeys = { w: false, a: false, s: false, d: false };
    const clock = new THREE.Clock();
    
    const MOVE_SPEED = 4.5; 

    // First Person Mode States
    let isFirstPerson = false;
    let mobileMoveVector = { x: 0, y: 0 };
    let isTouchDevice = false;

    // Room Bounds for Soft Collision & Rebound
    const ROOM_BOUNDS = {
      minX: -9.5,  maxX: 9.5,
      minZ: -7.5,  maxZ: 7.5,
      minY: 1.0,   maxY: 6.5
    };

    let isModalOpen = false;

    // Explosion Particles
    let explosionParticles, explosionLight;
    let isExploding = false;
    let isEmergencyFlashing = false;

    // Default Camera Position & Target
    const DEFAULT_CAM_POS = { x: 0, y: 3.5, z: 7.0 };
    const DEFAULT_TARGET_POS = { x: 0, y: 1.2, z: -1.5 };

    // Containment Pod Data
    const podData = [
      { id: "pod_1", name: "Specimen A: Phiedoro", desc: "Project Phiedoro", filled: true, isFailed: false, color: 0xffb703, pos: { x: -5.2, y: 1.0, z: -2.0 }, url: "https://phiedoro.vercel.app" },
      { id: "pod_2", name: "Specimen B: Proteica", desc: "Project Proteica", filled: true, isFailed: false, color: 0x10b981, pos: { x: -3.7, y: 1.0, z: -2.0 }, url: "https://proteica.vercel.app" },
      { id: "pod_3", name: "Specimen C: Alarm Gempa", desc: "Project Alarm Gempa", filled: true, isFailed: false, color: 0x00f2fe, pos: { x: -2.2, y: 1.0, z: -2.0 }, url: "https://alarmgempa.vercel.app" },
      { id: "pod_4", name: "EXPERIMENT #04 [CRITICAL]", desc: "WARNING: Thermal runaway detected! Particle containment breach in progress.", filled: true, isFailed: true, color: 0xef4444, pos: { x: -0.7, y: 1.0, z: -2.0 } },
      { id: "pod_5", name: "Empty Pod 05", desc: "Vacuum sealed containment chamber. Ready for sample deployment.", filled: false, isFailed: false, color: 0x334155, pos: { x: 0.7, y: 1.0, z: -2.0 } },
      { id: "pod_6", name: "Empty Pod 06", desc: "Vacuum sealed containment chamber. Ready for sample deployment.", filled: false, isFailed: false, color: 0x334155, pos: { x: 2.2, y: 1.0, z: -2.0 } },
      { id: "pod_7", name: "Empty Pod 07", desc: "Vacuum sealed containment chamber. Ready for sample deployment.", filled: false, isFailed: false, color: 0x334155, pos: { x: 3.7, y: 1.0, z: -2.0 } },
      { id: "pod_8", name: "Empty Pod 08", desc: "Vacuum sealed containment chamber. Ready for sample deployment.", filled: false, isFailed: false, color: 0x334155, pos: { x: 5.2, y: 1.0, z: -2.0 } },
    ];

    // Web Audio API Audio Engine
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let ambientGainNode = null;
    let ambientFilterNode = null;
    let isAmbientPlaying = false;
    const SERVER_RACK_POS = new THREE.Vector3(-9.5, 2.5, -6.5);

    function initAmbientSound() {
      if (isAmbientPlaying) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();

      // White Noise Generator untuk Ambient Server Hum
      const bufferSize = audioCtx.sampleRate * 2;
      const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }

      const whiteNoise = audioCtx.createBufferSource();
      whiteNoise.buffer = noiseBuffer;
      whiteNoise.loop = true;

      // Lowpass Filter untuk menghasilkan dengung mesin lab rendah
      ambientFilterNode = audioCtx.createBiquadFilter();
      ambientFilterNode.type = 'lowpass';
      ambientFilterNode.frequency.setValueAtTime(140, audioCtx.currentTime);

      ambientGainNode = audioCtx.createGain();
      ambientGainNode.gain.setValueAtTime(0.01, audioCtx.currentTime);

      whiteNoise.connect(ambientFilterNode);
      ambientFilterNode.connect(ambientGainNode);
      ambientGainNode.connect(audioCtx.destination);

      whiteNoise.start();
      isAmbientPlaying = true;
    }

    function updateAmbientVolume() {
      if (!ambientGainNode) return;
      const dist = camera.position.distanceTo(SERVER_RACK_POS);
      // Volume meredup seiring menjauhnya kamera dari server rack (Max 15m)
      const maxDist = 15.0;
      let targetVol = 1.0 - Math.min(dist / maxDist, 1.0);
      targetVol = Math.pow(targetVol, 2) * 0.22; // Master Ambient Volume
      ambientGainNode.gain.setTargetAtTime(targetVol, audioCtx.currentTime, 0.1);
    }

    function playClickSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      initAmbientSound();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(850, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.05);
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    }

    function playAlarmSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      initAmbientSound();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(400, audioCtx.currentTime);
      osc.frequency.linearRampToValueAtTime(800, audioCtx.currentTime + 0.3);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    }

    // Helper: Generate Procedural Micro-Noise Texture
    function generateNoiseTexture(width, height, factor) {
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      const imgData = ctx.createImageData(width, height);
      for (let i = 0; i < imgData.data.length; i += 4) {
        const val = Math.floor(Math.random() * factor);
        imgData.data[i] = val;
        imgData.data[i + 1] = val;
        imgData.data[i + 2] = val;
        imgData.data[i + 3] = 255;
      }
      ctx.putImageData(imgData, 0, 0);
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    function setupMobileControls() {
      isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
      const joystick = document.getElementById('mobile-controls');
      const stick = document.getElementById('joystick-stick');
      const touchZone = document.getElementById('touch-look-zone');
      let touchId = null, startX = 0, startY = 0;
      let lookTouchId = null, lastLookX = 0, lastLookY = 0;

      // Mobile Touch Joystick Logic
      window.addEventListener('touchstart', (e) => {
        if (!isFirstPerson) return;
        for (let i = 0; i < e.changedTouches.length; i++) {
          const t = e.changedTouches[i];
          if (t.clientX < window.innerWidth / 2 && touchId === null) {
            touchId = t.identifier;
            startX = t.clientX;
            startY = t.clientY;
          }
        }
      });

      window.addEventListener('touchmove', (e) => {
        if (!isFirstPerson || touchId === null) return;
        for (let i = 0; i < e.changedTouches.length; i++) {
          const t = e.changedTouches[i];
          if (t.identifier === touchId) {
            let dx = t.clientX - startX;
            let dy = t.clientY - startY;
            let dist = Math.min(Math.sqrt(dx*dx + dy*dy), 40);
            let angle = Math.atan2(dy, dx);
            
            stick.style.transform = `translate(-50%, -50%) translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
            mobileMoveVector.x = (Math.cos(angle) * dist) / 40;
            mobileMoveVector.y = (Math.sin(angle) * dist) / 40;
          }
        }
      });

      const resetStick = (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
          if (e.changedTouches[i].identifier === touchId) {
            touchId = null;
            stick.style.transform = 'translate(-50%, -50%)';
            mobileMoveVector.x = 0;
            mobileMoveVector.y = 0;
          }
        }
      };

      window.addEventListener('touchend', resetStick);
      window.addEventListener('touchcancel', resetStick);

      // Mobile Drag to Look Around Logic
      touchZone.addEventListener('touchstart', (e) => {
        if (!isFirstPerson) return;
        for (let i = 0; i < e.changedTouches.length; i++) {
          const t = e.changedTouches[i];
          if (lookTouchId === null) {
            lookTouchId = t.identifier;
            lastLookX = t.clientX;
            lastLookY = t.clientY;
          }
        }
      });

      touchZone.addEventListener('touchmove', (e) => {
        if (!isFirstPerson || lookTouchId === null) return;
        for (let i = 0; i < e.changedTouches.length; i++) {
          const t = e.changedTouches[i];
          if (t.identifier === lookTouchId) {
            const dx = t.clientX - lastLookX;
            const dy = t.clientY - lastLookY;
            lastLookX = t.clientX;
            lastLookY = t.clientY;

            // Rotate camera via Euler
            const euler = new THREE.Euler(0, 0, 0, 'YXZ');
            euler.setFromQuaternion(camera.quaternion);
            euler.y -= dx * 0.005;
            euler.x -= dy * 0.005;
            euler.x = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, euler.x));
            camera.quaternion.setFromEuler(euler);
          }
        }
      });

      const resetLook = (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
          if (e.changedTouches[i].identifier === lookTouchId) {
            lookTouchId = null;
          }
        }
      };
      touchZone.addEventListener('touchend', resetLook);
      touchZone.addEventListener('touchcancel', resetLook);
    }

    /* SISTEM PENANGANAN WASD CONTROL DI MODE NORMAL & FIRST PERSON */
    function updateMovement(delta) {
      if (isModalOpen) return;

      const speed = MOVE_SPEED * delta;
      const moveDir = new THREE.Vector3();

      if (isFirstPerson) {
        // First Person Movement Logic
        const forward = new THREE.Vector3();
        camera.getWorldDirection(forward);
        forward.y = 0;
        forward.normalize();

        const side = new THREE.Vector3();
        side.crossVectors(forward, camera.up).normalize();

        if (moveKeys.w || mobileMoveVector.y < -0.2) moveDir.add(forward);
        if (moveKeys.s || mobileMoveVector.y > 0.2) moveDir.sub(forward);
        if (moveKeys.d || mobileMoveVector.x > 0.2) moveDir.add(side);
        if (moveKeys.a || mobileMoveVector.x < -0.2) moveDir.sub(side);

        if (moveDir.lengthSq() > 0) {
          moveDir.normalize().multiplyScalar(speed);
          camera.position.add(moveDir);

          // Soft Room Boundary Lock
          camera.position.x = Math.max(ROOM_BOUNDS.minX, Math.min(ROOM_BOUNDS.maxX, camera.position.x));
          camera.position.z = Math.max(ROOM_BOUNDS.minZ, Math.min(ROOM_BOUNDS.maxZ, camera.position.z));
        }
      } else {
        // Normal OrbitControls WASD Navigation
        if (!controls || !controls.enabled) return;

        const forward = new THREE.Vector3();
        camera.getWorldDirection(forward);
        forward.y = 0;
        forward.normalize();

        const side = new THREE.Vector3();
        side.crossVectors(forward, camera.up).normalize();

        if (moveKeys.w) moveDir.add(forward);
        if (moveKeys.s) moveDir.sub(forward);
        if (moveKeys.d) moveDir.add(side);
        if (moveKeys.a) moveDir.sub(side);

        if (moveDir.lengthSq() > 0) {
          moveDir.normalize().multiplyScalar(speed);
          
          // Geser Kamera dan Target OrbitControls secara bersamaan
          camera.position.add(moveDir);
          controls.target.add(moveDir);

          // Boundary limit
          camera.position.x = Math.max(ROOM_BOUNDS.minX, Math.min(ROOM_BOUNDS.maxX, camera.position.x));
          camera.position.z = Math.max(ROOM_BOUNDS.minZ, Math.min(ROOM_BOUNDS.maxZ, camera.position.z));
        }
      }
    }

    /* VOLUMETRIC LIGHTING / FOG CONES & REALISTIC LIGHT-BOUND DUST PARTICLES */
    function setupVolumetricLightingAndDust() {
      lightDustGroup = new THREE.Group();

      const lightCenters = [-4.5, 0, 4.5];
      
      const fogGeo = new THREE.CylinderGeometry(0.35, 2.6, 4.5, 32, 1, true);

      lightCenters.forEach(x => {
        const fogMat = new THREE.MeshBasicMaterial({
          color: 0x00f2fe,
          transparent: true,
          opacity: 0.055,
          side: THREE.DoubleSide,
          depthWrite: false,
          blending: THREE.AdditiveBlending
        });

        const fogMesh = new THREE.Mesh(fogGeo, fogMat);
        fogMesh.position.set(x, 3.0, -2.0);
        lightDustGroup.add(fogMesh);
        volumetricCones.push(fogMesh);
      });

      const dustPerCone = 140;
      const totalDust = lightCenters.length * dustPerCone;
      const dustGeo = new THREE.BufferGeometry();
      const positions = new Float32Array(totalDust * 3);
      const dustData = [];

      let idx = 0;
      lightCenters.forEach(cx => {
        for (let i = 0; i < dustPerCone; i++) {
          const height = Math.random() * 4.2; 
          
          const topR = 0.35;
          const bottomR = 2.6;
          const maxRadiusAtHeight = topR + (height / 4.2) * (bottomR - topR);
          const currentRadius = maxRadiusAtHeight * Math.sqrt(Math.random()); 
          const angle = Math.random() * Math.PI * 2;

          const px = cx + Math.cos(angle) * currentRadius;
          const py = 5.2 - height;
          const pz = -2.0 + Math.sin(angle) * currentRadius;

          positions[idx * 3] = px;
          positions[idx * 3 + 1] = py;
          positions[idx * 3 + 2] = pz;

          dustData.push({
            centerX: cx,
            centerZ: -2.0,
            baseY: py,
            height: height,
            radius: currentRadius,
            angle: angle,
            speedY: Math.random() * 0.003 + 0.001,
            swaySpeed: Math.random() * 1.5 + 0.5,
            swayAmp: Math.random() * 0.08 + 0.02
          });
          idx++;
        }
      });

      dustGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

      const canvas = document.createElement('canvas');
      canvas.width = 32; canvas.height = 32;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
      grad.addColorStop(0, 'rgba(255,255,255,1)');
      grad.addColorStop(0.3, 'rgba(0,242,254,0.8)');
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 32, 32);

      const dustTex = new THREE.CanvasTexture(canvas);

      const dustMat = new THREE.PointsMaterial({
        color: 0xe0f7fa,
        size: 0.045,
        map: dustTex,
        transparent: true,
        opacity: 0.75,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      const dustParticles = new THREE.Points(dustGeo, dustMat);
      dustParticles.userData = { dustData: dustData };
      lightDustGroup.add(dustParticles);

      scene.add(lightDustGroup);
    }

    function buildAnimatedPipes(parent) {
      const pipeGroup = new THREE.Group();

      const holoBeam = new THREE.Mesh(new THREE.ConeGeometry(0.65, 1.3, 32, 1, true), coneMat);
      holoBeam.position.set(0, 1.6, 0);
      benchGroup.add(holoBeam);

      dnaHologramGroup = new THREE.Group();
      dnaHologramGroup.position.set(0, 1.65, 0);

      const sphereGeo = new THREE.SphereGeometry(0.035, 12, 12);
      const cyanMat = new THREE.MeshStandardMaterial({ color: 0x00f2fe, emissive: 0x00f2fe, emissiveIntensity: 3.0, transparent: true, opacity: 0.95 });
      const goldMat = new THREE.MeshStandardMaterial({ color: 0xffb703, emissive: 0xffb703, emissiveIntensity: 3.0, transparent: true, opacity: 0.95 });
      const bondMat = new THREE.MeshBasicMaterial({ color: 0xa5f3fc, transparent: true, opacity: 0.65 });

      const numPairs = 18;
      const dnaHeight = 1.1;
      const radius = 0.22;
      const turns = 2.0;

      for (let i = 0; i < numPairs; i++) {
        const progress = i / (numPairs - 1);
        const y = (progress - 0.5) * dnaHeight;
        const angle = progress * Math.PI * 2 * turns;

        const x1 = Math.cos(angle) * radius;
        const z1 = Math.sin(angle) * radius;
        const x2 = Math.cos(angle + Math.PI) * radius;
        const z2 = Math.sin(angle + Math.PI) * radius;

        const nodeA = new THREE.Mesh(sphereGeo, cyanMat);
        nodeA.position.set(x1, y, z1);
        dnaHologramGroup.add(nodeA);

        const nodeB = new THREE.Mesh(sphereGeo, goldMat);
        nodeB.position.set(x2, y, z2);
        dnaHologramGroup.add(nodeB);

        const dist = Math.sqrt((x2 - x1) ** 2 + (z2 - z1) ** 2);
        const bondGeo = new THREE.CylinderGeometry(0.008, 0.008, dist, 8);
        const bond = new THREE.Mesh(bondGeo, bondMat);
        bond.position.set((x1 + x2) / 2, y, (z1 + z2) / 2);
        bond.rotation.z = Math.PI / 2;
        bond.rotation.y = -angle;
        dnaHologramGroup.add(bond);
      }

      benchGroup.add(dnaHologramGroup);

      const dnaHitbox = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.7, 1.8, 16), new THREE.MeshBasicMaterial({ visible: false }));
      dnaHitbox.position.set(0, 1.5, 0);
      dnaHitbox.userData = { type: "dna_hologram" };
      interactiveObjects.push(dnaHitbox);
      benchGroup.add(dnaHitbox);

      parent.add(benchGroup);
    }

    function setupExplosionParticles() {
      const pCount = 120;
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(pCount * 3);
      const velocities = [];

      for (let i = 0; i < pCount; i++) {
        positions[i * 3] = -0.7; positions[i * 3 + 1] = 1.85; positions[i * 3 + 2] = -2.0;
        velocities.push((Math.random() - 0.5) * 0.18, (Math.random() - 0.5) * 0.18, (Math.random() - 0.5) * 0.18);
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const pMat = new THREE.PointsMaterial({ color: 0xef4444, size: 0.12, transparent: true, opacity: 0 });

      explosionParticles = new THREE.Points(geometry, pMat);
      explosionParticles.userData = { velocities: velocities, count: pCount };
      scene.add(explosionParticles);
    }

    function triggerExplosion() {
      isExploding = true;
      isEmergencyFlashing = true;
      explosionParticles.material.opacity = 1.0;

      const posAttr = explosionParticles.geometry.attributes.position;
      for (let i = 0; i < explosionParticles.userData.count; i++) { posAttr.setXYZ(i, -0.7, 1.85, -2.0); }
      posAttr.needsUpdate = true;

      playAlarmSound();

      gsap.to(explosionLight, { intensity: 8.0, duration: 0.1, yoyo: true, repeat: 3 });
      gsap.to(camera.position, { x: camera.position.x + 0.15, y: camera.position.y + 0.15, duration: 0.05, yoyo: true, repeat: 5 });

      let flashCount = 0;
      const originalColors = roomLights.map(l => l.color.getHex());

      const flashInterval = setInterval(() => {
        flashCount++;
        roomLights.forEach(light => {
          light.color.setHex(flashCount % 2 === 0 ? 0xef4444 : 0x020617);
          light.intensity = flashCount % 2 === 0 ? 2.5 : 0.2;
        });
        if (flashCount >= 10) {
          clearInterval(flashInterval);
          roomLights.forEach((light, i) => {
            light.color.setHex(originalColors[i]);
            light.intensity = isLightOn ? 1.6 : 0;
          });
          isEmergencyFlashing = false;
        }
      }, 250);

      setTimeout(() => {
        gsap.to(explosionParticles.material, { opacity: 0, duration: 0.8 });
        isExploding = false;
      }, 600);
    }

    function onTouchStart(event) {
      if (event.touches.length > 1) return;
      const touch = event.touches[0];
      // Jika sentuhan terjadi pada elemen UI modal, biarkan interaksi standard UI
      if (event.target.closest('#project-modal') || event.target.closest('.camera-hud-controls') || event.target.closest('#mobile-controls')) {
        return;
      }
      
      const touchMouse = new THREE.Vector2(
        (touch.clientX / window.innerWidth) * 2 - 1,
        -(touch.clientY / window.innerHeight) * 2 + 1
      );
      const intersects = checkRaycastIntersects(touchMouse);
      if (intersects.length > 0) {
        hoveredObj = intersects[0].object;
        onClick();
      }
    }

    function startPuzzleSequence(historyEl) {
      puzzleActive = true;
      puzzleStage = 1;
      puzzleTargetFreq = Math.floor(Math.random() * 400) + 100; // 100 - 500 Hz

      const initLine = document.createElement('div');
      initLine.className = 'terminal-line';
      initLine.style.color = 'var(--accent-gold)';
      initLine.innerHTML = `
        <br><b>[SPECIMEN #04 OVERRIDE DIAGNOSTIC INITIALIZED]</b><br>
        --------------------------------------------------<br>
        <b>STAGE 1: FREQUENCY CALIBRATION</b><br>
        Target Resonance Frequency detected between 100 Hz - 500 Hz.<br>
        Type <b>freq &lt;value&gt;</b> (e.g. 'freq 250') to find resonance.<br>
        --------------------------------------------------
      `;
      historyEl.appendChild(initLine);
    }

    function handlePuzzleInput(cmd, historyEl, terminalEl) {
      const resLine = document.createElement('div');
      resLine.className = 'terminal-line';

      if (puzzleStage === 1) {
        if (cmd.startsWith('freq')) {
          const val = parseInt(cmd.split(' ')[1]);
          if (isNaN(val)) {
            resLine.style.color = 'var(--accent-red)';
            resLine.innerHTML = `> Invalid input. Use: freq <100-500>`;
          } else if (val < puzzleTargetFreq) {
            resLine.style.color = 'var(--accent-gold)';
            resLine.innerHTML = `> ${val} Hz is TOO LOW. Increase resonance frequency.`;
          } else if (val > puzzleTargetFreq) {
            resLine.style.color = 'var(--accent-gold)';
            resLine.innerHTML = `> ${val} Hz is TOO HIGH. Decrease resonance frequency.`;
          } else {
            resLine.style.color = 'var(--accent-green)';
            resLine.innerHTML = `> RESONANCE MATCHED AT ${val} Hz! Stage 1 Passed.<br><br>`;
            
            // Proceed to Stage 2
            puzzleStage = 2;
            const seqLength = 4;
            const colors = ['alpha', 'beta', 'gamma', 'delta'];
            puzzleSequence = [];
            for (let i = 0; i < seqLength; i++) {
              puzzleSequence.push(colors[Math.floor(Math.random() * colors.length)]);
            }
            puzzleSeqIndex = 0;

            resLine.innerHTML += `
              <b>STAGE 2: QUANTUM SEQUENCE STABILIZATION</b><br>
              Re-enter the required quantum sequence key in exact order:<br>
              <b style="color:var(--accent-cyan)">[ ${puzzleSequence.join(' -> ').toUpperCase()} ]</b><br>
              Enter first token (${puzzleSequence[0]}):
            `;
          }
        } else {
          resLine.style.color = 'var(--accent-red)';
          resLine.innerHTML = `> Stage 1 Active. Format: freq <value>`;
        }
      } else if (puzzleStage === 2) {
        const expected = puzzleSequence[puzzleSeqIndex];
        if (cmd === expected) {
          puzzleSeqIndex++;
          if (puzzleSeqIndex >= puzzleSequence.length) {
            resLine.style.color = 'var(--accent-green)';
            resLine.innerHTML = `> QUANTUM SEQUENCE FULLY STABILIZED! Stage 2 Passed.<br><br>`;

            // Proceed to Stage 3
            puzzleStage = 3;
            puzzlePasscode = Math.floor(Math.random() * 8999) + 1000;
            resLine.innerHTML += `
              <b>STAGE 3: SECURITY PASSCODE OVERRIDE</b><br>
              System Security Override Token: <b style="color:var(--accent-gold)">${puzzlePasscode}</b><br>
              Enter passcode to confirm override:
            `;
          } else {
            resLine.style.color = 'var(--accent-cyan)';
            resLine.innerHTML = `> Token accepted (${puzzleSeqIndex}/${puzzleSequence.length}). Enter next token (${puzzleSequence[puzzleSeqIndex]}):`;
          }
        } else {
          resLine.style.color = 'var(--accent-red)';
          resLine.innerHTML = `> INVALID TOKEN! Sequence failed. Enter token '${expected}':`;
        }
      } else if (puzzleStage === 3) {
        if (parseInt(cmd) === puzzlePasscode) {
          puzzleActive = false;
          resLine.style.color = 'var(--accent-green)';
          resLine.innerHTML = `
            ==================================================<br>
            <b>[SUCCESS] CRITICAL CONTAINMENT POD #04 STABILIZED!</b><br>
            Thermal runaway contained. Specimen core reset to safe state.<br>
            ==================================================
          `;
          
          // Reset status failed pod
          const failedPod = podData.find(p => p.id === "pod_4");
          if (failedPod) {
            failedPod.isFailed = false;
            failedPod.name = "Specimen D: Stabilized";
            failedPod.desc = "Containment re-established successfully via mainframe override.";
          }
        } else {
          resLine.style.color = 'var(--accent-red)';
          resLine.innerHTML = `> INCORRECT PASSCODE! Re-enter token: ${puzzlePasscode}`;
        }
      }

      historyEl.appendChild(resLine);
      terminalEl.scrollTop = terminalEl.scrollHeight;
    }

    function showModal(data) {
      isModalOpen = true;
      const modal = document.getElementById('project-modal');
      const mTag = document.getElementById('m-tag');
      const mTitle = document.getElementById('m-title');
      const mDesc = document.getElementById('m-desc');
      const mLink = document.getElementById('m-link-container');
      const mTerminal = document.getElementById('m-terminal');
      const osControlWrapper = document.getElementById('os-control-wrapper');

      mTag.textContent = data.tag || (data.filled ? "CONTAINMENT POD" : "EMPTY POD");
      mTag.className = "project-tag";
      if (data.isFailed) mTag.classList.add("danger");
      if (data.isInfo) mTag.classList.add("info");

      mTitle.textContent = data.name;
      mDesc.textContent = data.desc;

      if (data.url) {
        mLink.innerHTML = `<a href="${data.url}" target="_blank" class="modal-link-btn"><i class="fa-solid fa-arrow-up-right-from-square"></i> Open Live Deployment</a>`;
      } else {
        mLink.innerHTML = '';
      }

      if (data.hasControlPanel) {
        osControlWrapper.style.display = "block";
      } else {
        osControlWrapper.style.display = "none";
      }

      if (data.hasTerminal) {
        mTerminal.style.display = "block";
        setupInteractiveTerminal();
      } else {
        mTerminal.style.display = "none";
      }

      modal.classList.add('active');
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      // Signal render pertama selesai untuk mematikan loader screen
      if (!LoadingManager.isFirstFrameRendered) {
        LoadingManager.isFirstFrameRendered = true;
        LoadingManager.complete();
      }

      updateMovement(delta);

      if (!isFirstPerson && controls && controls.enabled) {
        controls.update();
      }

      updateAmbientVolume();

      // DNA Hologram Rotation
      if (dnaHologramGroup) {
        dnaHologramGroup.rotation.y = time * 0.8;
      }

      // Animasi Flow Pipes
      flowPipes.forEach((pipe, index) => {
        pipe.material.emissiveIntensity = 1.5 + Math.sin(time * 3 + index) * 0.8;
      });

      // Animasi LED Server Racks
      serverLEDs.forEach((led, idx) => {
        if (led.isErr) {
          led.mesh.material.emissiveIntensity = 1.5 + Math.sin(time * 12) * 1.5;
        } else {
          if (Math.random() < 0.05) {
            led.mesh.material.emissiveIntensity = Math.random() * 2.5;
          }
        }
      });

      // Animasi Volumetric Dust Particles
      if (lightDustGroup && lightDustGroup.children[3]) {
        const dustPoints = lightDustGroup.children[3];
        const positions = dustPoints.geometry.attributes.position.array;
        const dustData = dustPoints.userData.dustData;

        for (let i = 0; i < dustData.length; i++) {
          const d = dustData[i];
          d.baseY += d.speedY;
          if (d.baseY > 5.2) d.baseY = 1.0; 

          const currentHeight = 5.2 - d.baseY;
          const topR = 0.35, bottomR = 2.6;
          const maxR = topR + (currentHeight / 4.2) * (bottomR - topR);

          d.angle += 0.005;
          const currentR = Math.min(d.radius, maxR);
          
          positions[i * 3] = d.centerX + Math.cos(d.angle) * currentR + Math.sin(time * d.swaySpeed) * d.swayAmp;
          positions[i * 3 + 1] = d.baseY;
          positions[i * 3 + 2] = d.centerZ + Math.sin(d.angle) * currentR + Math.cos(time * d.swaySpeed) * d.swayAmp;
        }
        dustPoints.geometry.attributes.position.needsUpdate = true;
      }

      // Animasi Partikel Ledakan jika triggered
      if (isExploding && explosionParticles) {
        const posAttr = explosionParticles.geometry.attributes.position;
        const vels = explosionParticles.userData.velocities;
        for (let i = 0; i < explosionParticles.userData.count; i++) {
          posAttr.setX(i, posAttr.getX(i) + vels[i * 3]);
          posAttr.setY(i, posAttr.getY(i) + vels[i * 3 + 1]);
          posAttr.setZ(i, posAttr.getZ(i) + vels[i * 3 + 2]);
        }
        posAttr.needsUpdate = true;
      }

      composer.render();
    }

    window.onload = init;
  </script>
</body>
